name: Build binaries

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }} / MINIAUDIO
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: macos-arm64
            runner: macos-15
    defaults:
      run:
        shell: bash
    env:
      GIT_LFS_SKIP_SMUDGE: '1'

    steps:
      - name: Check out game (without assets)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve pinned engine
        id: engine
        run: |
          echo "sha=$(git rev-parse HEAD:libphx)" >> "$GITHUB_OUTPUT"
          # Derive the GitHub repository from the committed submodule URL.
          python3 - <<'PY'
          import os, re, subprocess
          url = subprocess.check_output([
              'git', 'config', '-f', '.gitmodules', '--get', 'submodule.libphx.url'
          ], text=True).strip()
          match = re.fullmatch(r'(?:git@github\.com:|https://github\.com/)([^/]+/[^/]+)\.git', url)
          if not match:
              raise SystemExit('Expected a GitHub submodule URL ending in .git')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('repository=' + match.group(1) + '\n')
          PY

      - name: Check out exact engine commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.engine.outputs.repository }}
          ref: ${{ steps.engine.outputs.sha }}
          path: libphx
          # Optional read-only engine deploy key if the engine fork is private.
          # With no key, checkout uses HTTPS (public forks need no secret).
          ssh-key: ${{ secrets.LIBPHX_DEPLOY_KEY }}
          persist-credentials: false

      - name: Verify engine pin and runner architecture
        env:
          EXPECTED_ENGINE: ${{ steps.engine.outputs.sha }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          test "$(git -C libphx rev-parse HEAD)" = "$EXPECTED_ENGINE"
          case "$PLATFORM" in
            macos-arm64) test "$(uname -m)" = arm64 ;;
            *) test "$RUNNER_ARCH" = X64 ;;
          esac

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          mkdir -p ci-logs
          # Use the runner's CMake instead of downloading Ubuntu's copy.
          cmake --version | tee ci-logs/dependencies.log
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 update 2>&1 | tee -a ci-logs/dependencies.log
          sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=2 -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 install -y --no-install-recommends \
            build-essential pkg-config libgl1-mesa-dev libglew-dev \
            libsdl2-dev libfreetype6-dev libluajit-5.1-dev liblz4-dev \
            libbullet-dev 2>&1 | tee -a ci-logs/dependencies.log

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config sdl2-compat glew freetype luajit lz4 bullet

      - name: Configure
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p ci-logs
          args=(-DCMAKE_BUILD_TYPE=RelWithDebInfo -DPHX_AUDIO_BACKEND=MINIAUDIO)
          case "$PLATFORM" in
            windows-x64) args+=(-G "Visual Studio 17 2022" -A x64) ;;
            macos-arm64) args+=(-DCMAKE_OSX_ARCHITECTURES=arm64) ;;
          esac
          cmake -S . -B build "${args[@]}" 2>&1 | tee ci-logs/configure.log

      - name: Compile engine and game
        run: cmake --build build --config RelWithDebInfo --parallel 4 2>&1 | tee ci-logs/build.log

      - name: Verify and archive binaries
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          python3 .github/scripts/package-build.py "$PLATFORM"
          case "$PLATFORM" in
            linux-x64)
              file bin/lt64 bin/libphx64.so | tee ci-logs/binary-info.log
              readelf -h bin/lt64 bin/libphx64.so >> ci-logs/binary-info.log
              ldd bin/lt64 bin/libphx64.so >> ci-logs/binary-info.log
              ;;
            macos-arm64)
              file bin/lt64 bin/libphx64.dylib | tee ci-logs/binary-info.log
              test "$(lipo -archs bin/lt64)" = arm64
              test "$(lipo -archs bin/libphx64.dylib)" = arm64
              otool -L bin/lt64 bin/libphx64.dylib >> ci-logs/binary-info.log
              ;;
          esac

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ltheory-${{ matrix.platform }}-miniaudio
          path: build/ci-dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.platform }}
          path: |
            ci-logs/
            build/CMakeCache.txt
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/CMakeFiles/*/CMakeCCompiler.cmake
            build/CMakeFiles/*/CMakeCXXCompiler.cmake
          if-no-files-found: warn
          retention-days: 14
